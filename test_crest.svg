             C 103,58 107,72 113,82
             C 117,88 120,95 119,102
             C 118,109 112,114 106,112
             C 100,110 98,104 101,98
             C 103,94 108,94 110,97
             C 112,100 110,104 107,104
             C 105,104 104,103 104,101"
          stroke="#0C549F" stroke-width="3.2" stroke-linecap="round" fill="none" />
    
    <!-- Clef outer arc down to stem -->
