             C 109,44 113,48 115,54
             C 119,64 116,78 112,89
             C 107,100 100,110 101,122
             C 102,132 108,140 103,147
             C 99,152 92,150 91,144
             C 90,138 96,135 99,139"
          stroke="#0C549F" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Clef bottom dot -->
    <circle cx="93" cy="144" r="4.5" fill="#0C549F" />

    <!-- Piano Keyboard sweeping ribbon -->
    <!-- Upper & lower boundary tracks of the keyboard -->
    <path d="M 96,66 C 90,84 82,104 83,124 C 84,134 96,141 116,142"
          stroke="#0C549F" stroke-width="1.8" fill="none" />
    <path d="M 104,64 C 108,82 112,102 104,122 C 99,134 112,141 120,142"
          stroke="#0C549F" stroke-width="1.8" fill="none" />

    <!-- Piano Keys (Fine hatching bars) -->
    <line x1="96" y1="68" x2="104" y2="66" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="93" y1="74" x2="106" y2="73" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="90" y1="80" x2="109" y2="80" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="88" y1="86" x2="112" y2="87" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="86" y1="92" x2="114" y2="94" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="84" y1="98" x2="112" y2="101" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="83" y1="104" x2="105" y2="107" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="83" y1="110" x2="103" y2="113" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="84" y1="116" x2="104" y2="119" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="86" y1="122" x2="105" y2="125" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="89" y1="128" x2="108" y2="130" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="93" y1="133" x2="111" y2="135" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="98" y1="138" x2="114" y2="139" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
    <line x1="104" y1="142" x2="117" y2="142" stroke="#0C549F" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>