<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="30%" stop-color="#E5B83A" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#FCE588" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#F3C649" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Top arc: KWAYA YA MTAKATIFU MONICA -->
    <path id="arcTop" d="M 31.1,63.4 A 78,78 0 0,1 168.9,63.4" fill="none" />
    <!-- Bottom arc: SEC 58 NAKURU -->
    <path id="arcBot" d="M 33.9,141.3 A 78,78 0 0,0 166.1,141.3" fill="none" />
  </defs>

  <!-- Background Circle: Deep Obsidian Black -->
  <circle cx="100" cy="100" r="99" fill="#0E131B" />

  <!-- Outermost Gold Border Ring -->
  <circle cx="100" cy="100" r="96" stroke="url(#goldRingGrad)" stroke-width="4.5" fill="none" />
  <!-- Thin Outermost Gold Hairline -->
  <circle cx="100" cy="100" r="91.5" stroke="#E5B83A" stroke-width="1.2" fill="none" />

  <!-- Inner Gold Dividing Ring -->
  <circle cx="100" cy="100" r="67" stroke="url(#goldRingGrad)" stroke-width="2.5" fill="none" />
  <circle cx="100" cy="100" r="64.5" stroke="#E5B83A" stroke-width="1" fill="none" />

  <!-- Top Text: KWAYA YA MTAKATIFU MONICA -->
  <text fill="url(#goldTextGrad)" font-size="12.6" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.2">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">KWAYA YA MTAKATIFU MONICA</textPath>
  </text>

  <!-- Left Star (Gold) -->
  <polygon points="22,96.5 23.8,101 28.5,101.3 24.8,104.2 26.2,108.8 22,106 17.8,108.8 19.2,104.2 15.5,101.3 20.2,101" fill="url(#goldRingGrad)" />

  <!-- Right Star (Gold) -->
  <polygon points="178,96.5 179.8,101 184.5,101.3 180.8,104.2 182.2,108.8 178,106 173.8,108.8 175.2,104.2 171.5,101.3 176.2,101" fill="url(#goldRingGrad)" />

  <!-- Bottom Text: SEC 58 NAKURU -->
  <text fill="url(#goldTextGrad)" font-size="14.5" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="2.4">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">SEC 58 NAKURU</textPath>
  </text>

  <!-- ==================== CENTER EMBLEM ==================== -->
  <g id="center-artwork">
    <!-- St. Monica Profile Silhouette in Gold -->
    <path d="M 104,44
             C 96,52 86,63 80,70
             C 75,75 73,78 72,82
             C 72,84 69,85 68,88
             C 67,90 70,92 70,95
             C 70,97 68,99 68,102
             C 69,105 73,109 76,114
             C 78,118 80,123 79,127
             C 75,123 72,118 70,113
             C 67,106 66,99 67,93
             C 67,86 71,81 72,77
             C 75,71 80,63 86,56
             C 94,47 100,44 104,44 Z"
          fill="url(#goldRingGrad)" />
    <!-- Solid mass fill of head profile -->
    <path d="M 98,48
             C 90,58 83,69 78,77
             C 74,83 74,90 75,96
             C 76,102 73,107 73,112
             C 74,117 78,122 81,128
             C 85,120 87,112 88,103
             C 89,94 91,85 93,76
             C 95,66 97,56 98,48 Z"
          fill="url(#goldRingGrad)" />

    <!-- Treble Clef in Radiant Gold -->
    <path d="M 106,48
             C 103,58 107,72 113,82
             C 117,88 120,95 119,102
             C 118,109 112,114 106,112
             C 100,110 98,104 101,98
             C 103,94 108,94 110,97
             C 112,100 110,104 107,104
             C 105,104 104,103 104,101"
          stroke="url(#goldTextGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    
    <path d="M 106,48
             C 109,44 113,48 115,54
             C 119,64 116,78 112,89
             C 107,100 100,110 101,122
             C 102,132 108,140 103,147
             C 99,152 92,150 91,144
             C 90,138 96,135 99,139"
          stroke="url(#goldTextGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <circle cx="93" cy="144" r="4.5" fill="url(#goldTextGrad)" />

    <!-- Piano Keyboard sweeping ribbon -->
    <path d="M 96,66 C 90,84 82,104 83,124 C 84,134 96,141 116,142"
          stroke="#FFFFFF" stroke-width="2.2" fill="none" />
    <path d="M 104,64 C 108,82 112,102 104,122 C 99,134 112,141 120,142"
          stroke="#FFFFFF" stroke-width="2.2" fill="none" />

    <!-- White Piano Keys with dark separators -->
    <line x1="96" y1="68" x2="104" y2="66" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="93" y1="74" x2="106" y2="73" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="90" y1="80" x2="109" y2="80" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="88" y1="86" x2="112" y2="87" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="86" y1="92" x2="114" y2="94" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="84" y1="98" x2="112" y2="101" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="83" y1="104" x2="105" y2="107" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="83" y1="110" x2="103" y2="113" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="84" y1="116" x2="104" y2="119" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="86" y1="122" x2="105" y2="125" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="89" y1="128" x2="108" y2="130" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="93" y1="133" x2="111" y2="135" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="98" y1="138" x2="114" y2="139" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
    <line x1="104" y1="142" x2="117" y2="142" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" />
  </g>
</svg>