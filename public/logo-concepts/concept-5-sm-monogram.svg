<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- St. Monica Third Mass Choir - Concept 5: SM Monogram with Cross -->
  <!-- Flat two-colour artwork: Deep Navy #0C2340 and Bright Orange #F59E0B -->
