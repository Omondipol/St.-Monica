<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- St. Monica Third Mass Choir - Concept 1: Teardrop Note Head with Cross -->
  <!-- Flat two-colour artwork: Deep Navy #0C2340 and Bright Orange #F59E0B -->
  <!-- Shape 1: Teardrop Note Head (tilted 18° human touch, evocative of St. Monica's tears) -->
  <path d="M 175 365 C 130 365 96 328 96 282 C 96 230 152 165 210 110 C 218 102 230 102 238 110 C 275 145 305 185 320 226 C 290 236 260 262 254 298 C 248 335 220 365 175 365 Z" fill="#F59E0B"/>
  
  <!-- Shape 2: Bold Ascending Note Stem (stroke thickness 38 units) -->
  <rect x="296" y="112" width="38" height="236" rx="19" fill="#0C2340"/>
  
  <!-- Shape 3: Latin Cross Vertical Shaft (thickness 36 units) -->
  <rect x="297" y="36" width="36" height="108" rx="8" fill="#0C2340"/>
  
  <!-- Shape 4: Latin Cross Horizontal Arm (thickness 36 units) -->
  <rect x="246" y="66" width="138" height="36" rx="8" fill="#0C2340"/>
  
  <!-- Shape 5: Teardrop Interior Resonant Note Eye (Generous breathing room) -->
  <circle cx="178" cy="288" r="32" fill="#FAF8F5"/>
</svg>
