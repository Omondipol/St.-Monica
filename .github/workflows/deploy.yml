name: Deploy St. Monica Choir Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (robust)
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          if [ -f package-lock.json ]; then
            echo "Using package-lock.json"
            npm ci --loglevel verbose || (echo "npm ci failed, showing npm logs..." && ls -la /home/runner/.npm/_logs || true && cat /home/runner/.npm/_logs/*.log || true && npm cache clean --force && npm install)
          else
            npm install --loglevel verbose || (echo "npm install failed, showing npm logs..." && ls -la /home/runner/.npm/_logs || true && cat /home/runner/.npm/_logs/*.log || true)
          fi

      - name: Print npm debug logs (only on failure)
        if: failure()
        run: |
          echo "=== npm debug logs ==="
          ls -la /home/runner/.npm/_logs || true
          cat /home/runner/.npm/_logs/*.log || true

      - name: Build production site
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: SPA fallback for GitHub Pages (404.html & .nojekyll)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
